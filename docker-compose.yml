# Local stack for Phases 0 to 3. Start it with: docker compose up -d
# The backend service joins this file in Step 1.3, once it exists.
services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: meetmind-dynamodb
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    working_dir: /home/dynamodblocal
    ports:
      - "127.0.0.1:${DYNAMODB_PORT:-8000}:8000"
    volumes:
      - ./.dynamodb:/home/dynamodblocal/data
